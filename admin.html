<style>
:root{--g:#0a3d22;--g2:#1fb05a;--gold:#e6c36a;--bg:#f3f0dd;--card:#fffdf0;--line:#0a3d2230}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:16px/1.7 Cairo,Tahoma,sans-serif;background:var(--bg);color:#06210f}
header{background:var(--g);color:#f3f0dd;padding:10px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:3}

<script type="module">
const $=s=>document.querySelector(s),m=$('#m');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3200)};
const fail=t=>{m.innerHTML='<div class="card"><b>تعذر التشغيل</b><p dir="ltr" style="word-break:break-all;white-space:pre-wrap">'+esc(t)+'</p></div>'};
const banner=t=>{let b=$('#err');if(!b){b=document.createElement('div');b.id='err';b.style.cssText='position:fixed;top:0;inset-inline:0;background:#b3261e;color:#fff;padding:10px;font-size:13px;z-index:20;direction:ltr;white-space:pre-wrap';b.onclick=()=>b.remove();document.body.append(b)}b.textContent=t+'  (tap to close)'};
addEventListener('error',e=>banner((e.message||'')+' @'+String(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno));addEventListener('unhandledrejection',e=>banner(String(e.reason?.stack||e.reason).slice(0,400)));
let CFG;try{({CFG}=await import('./config.js'))}catch(e){fail('config.js not found. ارفع مجلد js كاملاً إلى GitHub.\n'+e.message);throw e}
if(!CFG.firebase.apiKey){m.innerHTML='<div class="card">أكمل ملف config.js بإعدادات Firebase أولاً، وخطوات ذلك في ملف README.</div>';throw 0}
const V='https://www.gstatic.com/firebasejs/10.14.1/';
let initializeApp,A,F;try{({initializeApp}=await import(V+'firebase-app.js'));A=await import(V+'firebase-auth.js');F=await import(V+'firebase-firestore.js')}catch(e){fail('Firebase library failed to load. تحقق من الاتصال.\n'+e.message);throw e}
const app=initializeApp(CFG.firebase),auth=A.getAuth(app),db=F.getFirestore(app);
const col=async c=>(await F.getDocs(F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const put=(c,o)=>{const {id,...r}=o;return F.setDoc(F.doc(db,c,id),r)},rm=(c,id)=>F.deleteDoc(F.doc(db,c,id));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const iso=v=>v?v+':00+01:00':'',loc=s=>s?s.slice(0,16):'';
const get=(o,k)=>k.split('.').reduce((a,b)=>a?.[b],o),set=(o,k,v)=>{const p=k.split('.');let c=o;p.slice(0,-1).forEach(x=>c=c[x]??={});c[p.at(-1)]=v};
async function up(f){if(f.type&&!f.type.startsWith('image/'))throw Error('ملف غير مسموح');if(!CFG.cloud.name)throw Error('أكمل إعدادات Cloudinary في config.js');
  const dec=async f=>{try{return await createImageBitmap(f)}catch(e){const i=new Image();i.src=URL.createObjectURL(f);await i.decode();return i}};
 let w=f;try{const b=await dec(f),W=b.width||b.naturalWidth,H=b.height||b.naturalHeight,s=Math.min(1,1600/Math.max(W,H)),c=document.createElement('canvas');c.width=W*s|0;c.height=H*s|0;c.getContext('2d').drawImage(b,0,0,c.width,c.height);w=await new Promise(r=>c.toBlob(r,'image/webp',.82))||f}catch(e){if(f.size>10e6)throw Error('الصورة كبيرة وغير مدعومة. حوّلها إلى JPG أو التقط لقطة شاشة لها')}
 const fd=new FormData();fd.append('file',w);fd.append('upload_preset',CFG.cloud.preset);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.cloud.name}/image/upload`,{method:'POST',body:fd});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error('Cloudinary: '+(j.error?.message||r.status))}return(await r.json()).secure_url}

const L3=(k,l,t)=>[['.ar',' بالعربية'],['.en',' بالإنجليزية'],['.fr',' بالفرنسية']].map(([s,n])=>[k+s,l+n,t,s==='.ar'?'':'ltr']);
const S={
 posts:{n:'المنشورات',one:'منشور',f:[...L3('title','العنوان','t'),...L3('body','النص','ta'),['img','الصورة','img'],['type','النوع','sel',[['news','خبر'],['announce','إعلان'],['update','تحديث فعالية']]],['pinned','تثبيت في الأعلى','cb'],['publishAt','وقت الظهور (فارغ = الآن)','dt'],['pub','منشور للزوار','cb']]},
 events:{n:'الفعاليات',one:'فعالية',f:[...L3('title','العنوان','t'),['poster','الملصق','img'],['start','البداية','dt'],['end','النهاية','dt'],['allDay','فعالية ليوم كامل','cb'],['place','المكان','t'],['map','رابط الخريطة','t','ltr'],['desc','الوصف','ta'],['reg','رابط التسجيل','t','ltr'],['seats','عدد المقاعد','t'],['status','الحالة','sel',[['auto','تلقائية من التاريخ'],['postponed','مؤجلة'],['cancelled','ملغاة']]],['note','سطر توضيحي للزوار','t'],['publishAt','وقت الظهور (فارغ = الآن)','dt'],['album','صور الألبوم','imgs'],['pub','منشورة للزوار','cb']]}
};
S.people={n:'الأشخاص',one:'شخص',f:[...L3('title','الاسم','t'),...L3('role','الصفة','t'),['years','السنوات (مثل 2017 – 2022)','t'],['img','الصورة','img'],['group','المجموعة','sel',[['founder','مؤسس أو رئيس'],['member','عضو'],['board','الهيئة الإدارية']]],['order','الترتيب (رقم)','t'],['pub','موافق على النشر وإظهاره في الموقع','cb']]};
const stF=[];for(const n of [1,2,3])stF.push(['st'+n+'y','سنة أو عنوان صغير للمحطة '+n,'t'],...L3('st'+n+'t','عنوان المحطة '+n,'t'),...L3('st'+n+'b','نص المحطة '+n,'ta'));
S.settings={n:'الموقع',one:'الإعدادات',f:[['cover','صورة الغلاف (أول الصفحة الرئيسية)','img'],['social.instagram','رابط إنستغرام','t','ltr'],['social.tiktok','رابط تيك توك','t','ltr'],['social.facebook','رابط فيسبوك','t','ltr'],...L3('tx.h','العنوان الرئيسي','t'),...L3('tx.p','الوصف تحت العنوان','ta'),...L3('tx.school','اسم المدرسة في الأسفل','t'),...L3('tx.foot','سطر التذييل','t'),...stF]};
const SEED=[['','','الرئيس الأول ومؤسس النادي','Founder and first president','Fondateur et premier président','2017 – 2022','p1'],['Hanachi Lina','Hanachi Lina','الرئيسة الثانية','Second president','Deuxième présidente','2022 – 2023','p2'],['Guettat Ishak','Guettat Ishak','الرئيس الثالث','Third president','Troisième président','2023 – 2025','p3'],['Cherif Ali','Cherif Ali','الرئيس الرابع','Fourth president','Quatrième président','2025','p4'],['Kamel Soltani','Kamel Soltani','الرئيس الخامس (الحالي)','Fifth and current president','Cinquième président (actuel)','2025 –','p5']];

const MODELS=['gemini-3.1-flash-lite','gemini-3.5-flash','gemini-3-flash-preview'];
async function ai(prompt){const k=localStorage.gk;if(!k)throw Error('الصق مفتاح Gemini أولاً في تبويب المساعد');
 const ms=localStorage.gm?[localStorage.gm]:MODELS;let err='';
 for(const md of ms){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${md}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
  const j=await r.json().catch(()=>({}));
  if(r.ok)try{return JSON.parse(j.candidates[0].content.parts[0].text)}catch(e){throw Error('رد غير مفهوم من Gemini، أعد المحاولة')}
  err=j.error?.message||('HTTP '+r.status);if(r.status!==404)break}
 throw Error('Gemini: '+err)}
const CTX='AGRESA is a student science and agriculture club at HSAM, the Higher School of Agricultural Sciences Mostaganem, Algeria, founded 2017. Tone: warm, positive, proud, never compare with other clubs. Use only facts given by the user and never invent dates, names or places. Keep AGRESA, HSAM and personal names in Latin letters in every language.';
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Algiers',weekday:'long',year:'numeric',month:'2-digit',day:'2-digit'});
function aiView(){nav();
 m.innerHTML=`<div class="card"><label>ما الذي تريده؟</label><textarea id="ap" rows="5" placeholder="مثال: ورشة عن تقليم الأشجار السبت القادم من 9 إلى 12 في قاعة المحاضرات 3"></textarea><div class="row"><button id="a1">اكتب منشوراً</button><button class="o" id="a2">جهّز فعالية</button></div><p>تُحفظ النتيجة مسودة وتُفتح لتراجعها وتعدلها قبل النشر.</p></div>
 <div class="card"><label>مفتاح Gemini</label><input id="gk" type="password" dir="ltr" placeholder="${localStorage.gk?'محفوظ في هذا المتصفح':'الصق المفتاح'}"><label>النموذج (اتركه فارغاً للاختيار التلقائي)</label><input id="gm" dir="ltr" value="${esc(localStorage.gm||'')}"><button class="o" id="gs">حفظ</button><p>يبقى المفتاح في هذا المتصفح فقط، ولا يدخل كود الموقع.</p></div>`;
 $('#gs').onclick=()=>{if($('#gk').value.trim())localStorage.gk=$('#gk').value.trim();$('#gm').value.trim()?localStorage.gm=$('#gm').value.trim():localStorage.removeItem('gm');$('#gk').value='';toast('تم الحفظ')};
 const run=async f=>{const t=$('#ap').value.trim();if(!t)return alert('اكتب ما تريده أولاً');toast('جارٍ العمل...');try{await f(t)}catch(x){alert(x.message)}};
 $('#a1').onclick=()=>run(async t=>{const r=await ai(`${CTX}\nWrite a short announcement post from the user's notes (Arabic first, then English and French translations). Notes: ${t}\nReturn JSON exactly: {"title":{"ar":"","en":"","fr":""},"body":{"ar":"","en":"","fr":""}}`);
  form('posts',{id:uid(),type:'news',pub:false,created:Date.now(),title:r.title,body:r.body});toast('راجع المسودة ثم احفظ')});
 $('#a2').onclick=()=>run(async t=>{const r=await ai(`${CTX}\nToday in Algeria is ${today()}. Turn the user's notes into an event. Dates are Africa/Algiers local time. Leave a field empty if the user did not give it. Notes: ${t}\nReturn JSON exactly: {"title":{"ar":"","en":"","fr":""},"start":"YYYY-MM-DDTHH:MM","end":"YYYY-MM-DDTHH:MM","allDay":false,"place":"","desc":""}`);
  form('events',{id:uid(),title:r.title,start:iso(r.start),end:iso(r.end||''),allDay:!!r.allDay,place:r.place||'',desc:r.desc||'',pub:false,status:'auto',album:[],created:Date.now()});toast('راجع المسودة ثم احفظ')})}
let ret=null;
const back=c=>{if(ret==='preview'){ret=null;view='preview';return go()}if(c==='settings'){view='home';home()}else list(c)};
function previewView(){nav();m.innerHTML=`<p style="margin:0 0 8px">داخل المعاينة اضغط ✎ للتعديل أو 🗑 للحذف أو الأزرار الذهبية للإضافة، فيفتح النموذج هنا. المسودات لا تظهر في المعاينة.</p><iframe src="index.html?edit=1&_=${Date.now()}" style="width:100%;height:76vh;border:1.5px solid #0a3d2255;border-radius:14px;background:#fff"></iframe>`}
addEventListener('message',async e=>{if(e.origin!==location.origin||!auth.currentUser)return;const d=e.data||{};
 try{
  if(d.a==='set'){ret='preview';return settingsView()}
  if(!S[d.c]||d.c==='settings')return;
  if(d.a==='add'){ret='preview';return form(d.c,{id:uid(),pub:true,status:'auto',album:[],created:Date.now()})}
  if(d.a==='edit'){const s=await F.getDoc(F.doc(db,d.c,d.id));ret='preview';return form(d.c,{id:d.id,...s.data()})}
  if(d.a==='del'&&confirm('حذف نهائي؟')){await rm(d.c,d.id);toast('تم الحذف');view='preview';go()}
 }catch(x){alert(x.message)}});
const stt=e=>e.status==='cancelled'?'ملغاة':e.status==='postponed'?'مؤجلة':Date.now()<new Date(e.start)?'قادمة':Date.now()<=new Date(e.end)?'جارية':'منتهية';
const TABS=[['home','الرئيسية'],['posts','المنشورات'],['events','الفعاليات'],['preview','معاينة وتعديل'],['ai','المساعد'],['people','الأشخاص'],['settings','الموقع'],['inbox','الوارد']];
let view='home';
function nav(badge){$('#nav').hidden=false;$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k===view?'on':''}" data-v="${k}">${n}${k==='inbox'&&badge?` <span class="dot"></span>`:''}</button>`).join('')}
$('#nav').onclick=e=>{if(e.target.dataset.v){ret=null;view=e.target.dataset.v;go()}};
$('#out').onclick=()=>A.signOut(auth);
const go=()=>view==='home'?home():view==='inbox'?inbox('messages'):view==='settings'?settingsView():view==='ai'?aiView():view==='preview'?previewView():list(view);
async function settingsView(){nav();const d=await F.getDoc(F.doc(db,'settings','site'));form('settings',{id:'site',...(d.exists()?d.data():{})})}

let cur;
A.onAuthStateChanged(auth,async u=>{const key=u?u.uid:'';if(key===cur)return;cur=key;
 if(!u){$('#out').hidden=true;$('#nav').hidden=true;$('#me').textContent='';m.innerHTML='<div class="card"><p>سجّل الدخول بحساب Google المعتمد.</p><button id="in">الدخول بـ Google</button></div>';$('#in').onclick=()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()).catch(e=>toast('تعذر الدخول'));return}
 try{const d=await F.getDoc(F.doc(db,'admins',u.email.toLowerCase()));if(!d.exists())throw 0}
 catch(e){m.innerHTML='<div class="card">هذا الحساب غير معتمد كأدمن.</div>';setTimeout(()=>A.signOut(auth),2500);return}
 $('#me').textContent=u.email;$('#out').hidden=false;go()});

async function home(){
 const [a,b,c,ev,po]=await Promise.all(['messages','joins','feedback','events','posts'].map(col)),un=x=>x.filter(i=>!i.read).length;
 nav(un(a)+un(b)+un(c));
 const up=ev.filter(e=>e.pub&&['قادمة','جارية'].includes(stt(e))).length,card=(n,l)=>`<div class="card"><div class="n">${n}</div>${l}</div>`;
 m.innerHTML=`<div class="grid">${card(un(b),'طلبات انضمام جديدة')+card(un(a),'رسائل جديدة')+card(un(c),'آراء جديدة')+card(up,'فعاليات قادمة')+card(po.filter(p=>p.pub).length,'منشورات منشورة')}</div>
 <div class="card"><b>ابدأ من هنا</b><div class="row" style="margin-top:8px"><button data-q="posts">منشور جديد</button><button data-q="events">فعالية جديدة</button><button class="o" data-q="ai">مفتاح Gemini</button></div></div>`;
 m.onclick=e=>{const q=e.target.dataset.q;if(q==='ai'){view='ai';aiView()}else if(q)form(q,{id:uid(),pub:false,status:'auto',album:[],created:Date.now()})}}

async function list(c){
 nav();const d=(await col(c)).sort((a,b)=>c==='events'?(b.start||'').localeCompare(a.start||''):c==='people'?(+a.order||0)-(+b.order||0):(b.created||0)-(a.created||0));
 m.innerHTML=`<button id="add">${S[c].one} جديد${c==='events'?'ة':''}</button> ${c==='people'&&!d.length?'<button class="o" id="seed">استيراد الرؤساء الخمسة</button>':''}<div style="height:12px"></div>`+(d.map(o=>`<div class="card"><div class="row">${c==='events'?`<span class="tag">${stt(o)}</span>`:o.pinned?'<span class="tag">مثبّت</span>':''}<span class="tag" style="background:${o.pub?'#7be3a1':'#ddd'}">${o.pub?'منشور':'مسودة'}</span></div><h3 style="margin:6px 0">${esc(o.title?.ar||o.role?.ar||'بلا عنوان')}</h3>${o.years?`<div>${esc(o.years)}</div>`:''}${o.start?`<div>${esc(o.start.replace('T',' ').slice(0,16))}</div>`:''}<div class="row" style="margin-top:8px"><button class="s" data-e="${o.id}">تعديل</button><button class="s o" data-c="${o.id}">تكرار</button><button class="s r" data-d="${o.id}">حذف</button></div></div>`).join('')||'<div class="card">لا شيء بعد.</div>');
 $('#add').onclick=()=>form(c,{id:uid(),pub:false,status:'auto',album:[],created:Date.now()});
 if($('#seed'))$('#seed').onclick=async()=>{for(const [i,s] of SEED.entries())await put('people',{id:uid(),title:{ar:s[0],en:s[1],fr:s[1]},role:{ar:s[2],en:s[3],fr:s[4]},years:s[5],img:''+s[6]+'.webp',group:'founder',order:String(i+1),pub:true,created:Date.now()});toast('تم الاستيراد');list('people')};
 m.onclick=async e=>{const t=e.target.dataset,o=d.find(x=>x.id===(t.e||t.c||t.d));
  if(t.e)form(c,o);if(t.c)form(c,{...structuredClone(o),id:uid(),pub:false,created:Date.now(),start:'',end:'',album:[],publishAt:'',note:''});
  if(t.d&&confirm('حذف نهائي؟')){await rm(c,t.d);toast('تم الحذف');list(c)}}}

function form(c,o){
 nav();const fs=S[c].f,id=k=>'f_'+k.replace(/\./g,'_');
 const inp=([k,l,t,x,opt])=>{const v=get(o,k),i=id(k);
  if(t==='cb')return`<label class="c"><input type="checkbox" id="${i}" ${v?'checked':''}>${l}</label>`;
  let h=`<label>${l}</label>`;
  if(t==='t')h+=`<input id="${i}" dir="${x||'rtl'}" value="${esc(v)}">`;
  if(t==='ta')h+=`<textarea id="${i}" rows="5" dir="${x||'rtl'}">${esc(v)}</textarea>`;
  if(t==='dt')h+=`<input type="datetime-local" id="${i}" value="${loc(v)}">`;
  if(t==='sel')h+=`<select id="${i}">${opt.map(([a,b])=>`<option value="${a}" ${(v||opt[0][0])===a?'selected':''}>${b}</option>`).join('')}</select>`;
  if(t==='img')h+=`${v?`<img class="th" src="${esc(v)}">`:''}<input type="file" id="${i}" accept="image/*">`;
  if(t==='imgs')h+=`${(v||[]).map(u=>`<img class="th" src="${esc(u)}">`).join('')}<input type="file" id="${i}" accept="image/*" multiple>`;
  return h};
 m.innerHTML=`<div class="card">${fs.map(f=>inp([f[0],f[1],f[2],f[3],f[3]])).join('').replace(/<label>/g,'<label>')}${fs.some(f=>f[0].endsWith('.ar'))?'<button class="o" id="tr" style="margin-bottom:12px">ترجم من العربية بـ Gemini</button>':''}<div class="row"><button id="ok">حفظ</button><button class="o" id="bk">رجوع</button></div></div>`;
 $('#bk').onclick=()=>back(c);
 if($('#tr'))$('#tr').onclick=async()=>{const src={};for(const f of fs)if(f[0].endsWith('.ar')&&(f[2]==='t'||f[2]==='ta')){const v=$('#'+id(f[0])).value.trim();if(v)src[f[0].slice(0,-3)]=v}
  if(!Object.keys(src).length)return alert('اكتب النص بالعربية أولاً');
  try{toast('جارٍ الترجمة...');const r=await ai(`${CTX}\nTranslate each Arabic value to English and French. Return JSON {key:{"en":"","fr":""}} for exactly these keys: ${JSON.stringify(src)}`);
   for(const k in src)for(const l of ['en','fr']){const e=$('#'+id(k+'.'+l));if(e&&r[k]?.[l])e.value=r[k][l]}toast('تمت الترجمة. راجعها ثم احفظ')}catch(x){alert(x.message)}};
 $('#ok').onclick=async()=>{
  const n={...o},V=[];
  for(const [k,,t] of fs){const e=$('#'+id(k));if(!e){alert('حقل مفقود: '+k);return}
   V.push([k,t,t==='cb'?e.checked:t==='img'?e.files[0]:t==='imgs'?[...e.files]:t==='dt'?iso(e.value):e.value.trim()])}
  if(V.some(([,t,v])=>(t==='img'&&v)||(t==='imgs'&&v.length)))toast('جارٍ رفع الصور، انتظر...');
  try{for(const [k,t,v] of V){
   if(t==='img'){if(v)set(n,k,await up(v))}
   else if(t==='imgs'){const a=[...(o[k]||[])];for(const x of v)a.push(await up(x));set(n,k,a)}
   else set(n,k,v)}}catch(x){return alert(x.message)}
  if(c!=='settings'&&!(n.title?.ar||n.role?.ar))return alert('اكتب العنوان بالعربية');
  if(c==='events'){if(!n.start)return alert('حدد وقت البداية');if(n.allDay)n.end=n.start.slice(0,10)+'T23:59:00+01:00';if(!n.end||new Date(n.end)<new Date(n.start))return alert('وقت النهاية قبل وقت البداية. صحّحه ثم احفظ.')}
  try{await put(c,n);toast('تم الحفظ');back(c)}catch(e){alert('تعذر الحفظ: '+e.message)}}}

async function inbox(k){
 const d=(await col(k)).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0)),un=x=>x.filter(i=>!i.read).length;nav();
 const T={messages:'الرسائل',joins:'طلبات الانضمام',feedback:'آراء الزوار'};
 m.innerHTML=`<div class="row" style="margin-bottom:12px">${Object.entries(T).map(([a,b])=>`<button class="s ${a===k?'':'o'}" data-k="${a}">${b}</button>`).join('')}</div>`+(d.map(o=>`<div class="card"><div class="row">${o.read?'':'<span class="dot"></span>'}<b>${esc(o.name)}</b>${o.rate?`<span class="tag">${'★'.repeat(o.rate)}</span>`:''}<small>${esc(o.email||'')} ${o.at?new Date(o.at.seconds*1000).toLocaleString('ar-DZ-u-nu-latn',{timeZone:'Africa/Algiers'}):''}</small></div><p style="white-space:pre-wrap">${esc(o.msg)}</p><div class="row"><button class="s o" data-r="${o.id}">${o.read?'غير مقروء':'مقروء'}</button>${k==='feedback'?`<button class="s" data-ok="${o.id}">${o.ok?'إخفاء من الموقع':'عرض في الموقع'}</button>`:''}<button class="s r" data-d="${o.id}">حذف</button></div></div>`).join('')||'<div class="card">لا شيء بعد.</div>');
 m.onclick=async e=>{const t=e.target.dataset,o=d.find(x=>x.id===(t.r||t.ok||t.d));
  if(t.k)return inbox(t.k);
  if(t.r)await put(k,{...o,read:!o.read});if(t.ok)await put(k,{...o,ok:!o.ok,read:true});
  if(t.d&&confirm('حذف نهائي؟'))await rm(k,t.d);
  if(t.r||t.ok||t.d)inbox(k)}}
</script></body></html>
