<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>لوحة إدارة أڨريسا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0a3d22;--g2:#1fb05a;--gold:#e6c36a;--bg:#f3f0dd;--card:#fffdf0;--line:#0a3d2230}
*{box-sizing:border-box}body{margin:0;font:16px/1.7 Cairo,Tahoma,sans-serif;background:var(--bg);color:#06210f}
header{background:var(--g);color:#f3f0dd;padding:10px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:3}
header b{flex:1;font-size:18px}header small{opacity:.8;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#e9e5c9;position:sticky;top:56px;z-index:2}
nav button{white-space:nowrap;background:transparent;color:var(--g);border:1.5px solid var(--g)}nav button.on{background:var(--g);color:#fff}
main{max-width:800px;margin:auto;padding:16px}
button{font:inherit;font-weight:700;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--g2);color:#fff;cursor:pointer}
.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.r{background:#b3261e}.s{min-height:38px;padding:0 12px;font-size:14px}
input,textarea,select{font:inherit;width:100%;min-height:46px;padding:9px 12px;border-radius:12px;border:1.5px solid #0a3d2255;background:#fffdf0;margin-bottom:12px}
label{display:block;font-weight:700;margin-bottom:3px}label.c{display:flex;gap:10px;align-items:center}label.c input{width:22px;min-height:22px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.n{font:800 34px Cairo;color:var(--g2);line-height:1}.tag{background:var(--gold);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#b3261e;display:inline-block}
img.th{height:74px;border-radius:10px;margin:0 0 8px 8px}
#toast{position:fixed;bottom:14px;inset-inline:14px;background:#06210f;color:#fff;padding:14px;border-radius:12px;text-align:center;display:none;z-index:9}
</style></head><body>
<header><b>لوحة إدارة أڨريسا</b><small id="me"></small><button class="o s" id="out" hidden style="color:#fff;border-color:#fff">خروج</button></header>
<nav id="nav" hidden></nav><main id="m"></main><div id="toast"></div>
<script type="module">
import {CFG} from './js/config.js';
const $=s=>document.querySelector(s),m=$('#m');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3200)};
if(!CFG.firebase.apiKey){m.innerHTML='<div class="card">أكمل ملف js/config.js بإعدادات Firebase أولاً، وخطوات ذلك في ملف README.</div>';throw 0}
const V='https://www.gstatic.com/firebasejs/10.14.1/';
const {initializeApp}=await import(V+'firebase-app.js'),A=await import(V+'firebase-auth.js'),F=await import(V+'firebase-firestore.js');
const app=initializeApp(CFG.firebase),auth=A.getAuth(app),db=F.getFirestore(app);
const col=async c=>(await F.getDocs(F.collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const put=(c,o)=>{const {id,...r}=o;return F.setDoc(F.doc(db,c,id),r)},rm=(c,id)=>F.deleteDoc(F.doc(db,c,id));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const iso=v=>v?v+':00+01:00':'',loc=s=>s?s.slice(0,16):'';
const get=(o,k)=>k.split('.').reduce((a,b)=>a?.[b],o),set=(o,k,v)=>{const p=k.split('.');let c=o;p.slice(0,-1).forEach(x=>c=c[x]??={});c[p.at(-1)]=v};
async function up(f){if(!f.type.startsWith('image/'))throw Error('ملف غير مسموح');if(!CFG.cloud.name)throw Error('أكمل إعدادات Cloudinary في config.js');
 const b=await createImageBitmap(f),s=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s|0;c.height=b.height*s|0;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const w=await new Promise(r=>c.toBlob(r,'image/webp',.82)),fd=new FormData();fd.append('file',w);fd.append('upload_preset',CFG.cloud.preset);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.cloud.name}/image/upload`,{method:'POST',body:fd});if(!r.ok)throw Error('فشل الرفع');return(await r.json()).secure_url}

const L3=(k,l,t)=>[['.ar',' بالعربية'],['.en',' بالإنجليزية'],['.fr',' بالفرنسية']].map(([s,n])=>[k+s,l+n,t,s==='.ar'?'':'ltr']);
const S={
 posts:{n:'المنشورات',one:'منشور',f:[...L3('title','العنوان','t'),...L3('body','النص','ta'),['img','الصورة','img'],['type','النوع','sel',[['news','خبر'],['announce','إعلان'],['update','تحديث فعالية']]],['pinned','تثبيت في الأعلى','cb'],['publishAt','وقت الظهور (فارغ = الآن)','dt'],['pub','منشور للزوار','cb']]},
 events:{n:'الفعاليات',one:'فعالية',f:[...L3('title','العنوان','t'),['poster','الملصق','img'],['start','البداية','dt'],['end','النهاية','dt'],['allDay','فعالية ليوم كامل','cb'],['place','المكان','t'],['map','رابط الخريطة','t','ltr'],['desc','الوصف','ta'],['reg','رابط التسجيل','t','ltr'],['seats','عدد المقاعد','t'],['status','الحالة','sel',[['auto','تلقائية من التاريخ'],['postponed','مؤجلة'],['cancelled','ملغاة']]],['note','سطر توضيحي للزوار','t'],['publishAt','وقت الظهور (فارغ = الآن)','dt'],['album','صور الألبوم','imgs'],['pub','منشورة للزوار','cb']]}
};
const stt=e=>e.status==='cancelled'?'ملغاة':e.status==='postponed'?'مؤجلة':Date.now()<new Date(e.start)?'قادمة':Date.now()<=new Date(e.end)?'جارية':'منتهية';
const TABS=[['home','الرئيسية'],['posts','المنشورات'],['events','الفعاليات'],['inbox','الوارد']];
let view='home';
function nav(badge){$('#nav').hidden=false;$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k===view?'on':''}" data-v="${k}">${n}${k==='inbox'&&badge?` <span class="dot"></span>`:''}</button>`).join('')}
$('#nav').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;go()}};
$('#out').onclick=()=>A.signOut(auth);
const go=()=>view==='home'?home():view==='inbox'?inbox('messages'):list(view);

A.onAuthStateChanged(auth,async u=>{
 if(!u){$('#out').hidden=true;$('#nav').hidden=true;$('#me').textContent='';m.innerHTML='<div class="card"><p>سجّل الدخول بحساب Google المعتمد.</p><button id="in">الدخول بـ Google</button></div>';$('#in').onclick=()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()).catch(e=>toast('تعذر الدخول'));return}
 try{const d=await F.getDoc(F.doc(db,'admins',u.email.toLowerCase()));if(!d.exists())throw 0}
 catch(e){m.innerHTML='<div class="card">هذا الحساب غير معتمد كأدمن.</div>';setTimeout(()=>A.signOut(auth),2500);return}
 $('#me').textContent=u.email;$('#out').hidden=false;go()});

async function home(){
 const [a,b,c,ev,po]=await Promise.all(['messages','joins','feedback','events','posts'].map(col)),un=x=>x.filter(i=>!i.read).length;
 nav(un(a)+un(b)+un(c));
 const up=ev.filter(e=>e.pub&&['قادمة','جارية'].includes(stt(e))).length,card=(n,l)=>`<div class="card"><div class="n">${n}</div>${l}</div>`;
 m.innerHTML=`<div class="grid">${card(un(b),'طلبات انضمام جديدة')+card(un(a),'رسائل جديدة')+card(un(c),'آراء جديدة')+card(up,'فعاليات قادمة')+card(po.filter(p=>p.pub).length,'منشورات منشورة')}</div>
 <div class="card"><b>ابدأ من هنا</b><div class="row" style="margin-top:8px"><button data-q="posts">منشور جديد</button><button data-q="events">فعالية جديدة</button></div></div>`;
 m.onclick=e=>{if(e.target.dataset.q)form(e.target.dataset.q,{id:uid(),pub:false,status:'auto',album:[],created:Date.now()})}}

async function list(c){
 nav();const d=(await col(c)).sort((a,b)=>c==='events'?(b.start||'').localeCompare(a.start||''):(b.created||0)-(a.created||0));
 m.innerHTML=`<button id="add">${S[c].one} جديد${c==='events'?'ة':''}</button><div style="height:12px"></div>`+(d.map(o=>`<div class="card"><div class="row">${c==='events'?`<span class="tag">${stt(o)}</span>`:o.pinned?'<span class="tag">مثبّت</span>':''}<span class="tag" style="background:${o.pub?'#7be3a1':'#ddd'}">${o.pub?'منشور':'مسودة'}</span></div><h3 style="margin:6px 0">${esc(o.title?.ar||'بلا عنوان')}</h3>${o.start?`<div>${esc(o.start.replace('T',' ').slice(0,16))}</div>`:''}<div class="row" style="margin-top:8px"><button class="s" data-e="${o.id}">تعديل</button><button class="s o" data-c="${o.id}">تكرار</button><button class="s r" data-d="${o.id}">حذف</button></div></div>`).join('')||'<div class="card">لا شيء بعد.</div>');
 $('#add').onclick=()=>form(c,{id:uid(),pub:false,status:'auto',album:[],created:Date.now()});
 m.onclick=async e=>{const t=e.target.dataset,o=d.find(x=>x.id===(t.e||t.c||t.d));
  if(t.e)form(c,o);if(t.c)form(c,{...structuredClone(o),id:uid(),pub:false,created:Date.now(),start:'',end:'',album:[],publishAt:'',note:''});
  if(t.d&&confirm('حذف نهائي؟')){await rm(c,t.d);toast('تم الحذف');list(c)}}}

function form(c,o){
 nav();const fs=S[c].f,id=k=>'f_'+k.replace('.','_');
 const inp=([k,l,t,x,opt])=>{const v=get(o,k),i=id(k);
  if(t==='cb')return`<label class="c"><input type="checkbox" id="${i}" ${v?'checked':''}>${l}</label>`;
  let h=`<label>${l}</label>`;
  if(t==='t')h+=`<input id="${i}" dir="${x||'rtl'}" value="${esc(v)}">`;
  if(t==='ta')h+=`<textarea id="${i}" rows="5" dir="${x||'rtl'}">${esc(v)}</textarea>`;
  if(t==='dt')h+=`<input type="datetime-local" id="${i}" value="${loc(v)}">`;
  if(t==='sel')h+=`<select id="${i}">${opt.map(([a,b])=>`<option value="${a}" ${(v||opt[0][0])===a?'selected':''}>${b}</option>`).join('')}</select>`;
  if(t==='img')h+=`${v?`<img class="th" src="${esc(v)}">`:''}<input type="file" id="${i}" accept="image/*">`;
  if(t==='imgs')h+=`${(v||[]).map(u=>`<img class="th" src="${esc(u)}">`).join('')}<input type="file" id="${i}" accept="image/*" multiple>`;
  return h};
 m.innerHTML=`<div class="card">${fs.map(f=>inp([f[0],f[1],f[2],f[3],f[3]])).join('').replace(/<label>/g,'<label>')}<div class="row"><button id="ok">حفظ</button><button class="o" id="bk">رجوع</button></div></div>`;
 $('#bk').onclick=()=>list(c);
 $('#ok').onclick=async()=>{
  const n={...o};
  for(const f of fs){const [k,,t]=f,e=$('#'+id(k));
   if(t==='cb')set(n,k,e.checked);else if(t==='dt')set(n,k,iso(e.value));
   else if(t==='img'){if(e.files[0])try{set(n,k,await up(e.files[0]))}catch(x){return alert(x.message)}}
   else if(t==='imgs'){const a=[...(o[k]||[])];for(const x of e.files)try{a.push(await up(x))}catch(y){return alert(y.message)}set(n,k,a)}
   else set(n,k,e.value.trim())}
  if(!n.title?.ar)return alert('اكتب العنوان بالعربية');
  if(c==='events'){if(!n.start)return alert('حدد وقت البداية');if(n.allDay)n.end=n.start.slice(0,10)+'T23:59:00+01:00';if(!n.end||new Date(n.end)<new Date(n.start))return alert('وقت النهاية قبل وقت البداية. صحّحه ثم احفظ.')}
  try{await put(c,n);toast('تم الحفظ');list(c)}catch(e){alert('تعذر الحفظ: '+e.message)}}}

async function inbox(k){
 const d=(await col(k)).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0)),un=x=>x.filter(i=>!i.read).length;nav();
 const T={messages:'الرسائل',joins:'طلبات الانضمام',feedback:'آراء الزوار'};
 m.innerHTML=`<div class="row" style="margin-bottom:12px">${Object.entries(T).map(([a,b])=>`<button class="s ${a===k?'':'o'}" data-k="${a}">${b}</button>`).join('')}</div>`+(d.map(o=>`<div class="card"><div class="row">${o.read?'':'<span class="dot"></span>'}<b>${esc(o.name)}</b>${o.rate?`<span class="tag">${'★'.repeat(o.rate)}</span>`:''}<small>${esc(o.email||'')} ${o.at?new Date(o.at.seconds*1000).toLocaleString('ar-DZ-u-nu-latn',{timeZone:'Africa/Algiers'}):''}</small></div><p style="white-space:pre-wrap">${esc(o.msg)}</p><div class="row"><button class="s o" data-r="${o.id}">${o.read?'غير مقروء':'مقروء'}</button>${k==='feedback'?`<button class="s" data-ok="${o.id}">${o.ok?'إخفاء من الموقع':'عرض في الموقع'}</button>`:''}<button class="s r" data-d="${o.id}">حذف</button></div></div>`).join('')||'<div class="card">لا شيء بعد.</div>');
 m.onclick=async e=>{const t=e.target.dataset,o=d.find(x=>x.id===(t.r||t.ok||t.d));
  if(t.k)return inbox(t.k);
  if(t.r)await put(k,{...o,read:!o.read});if(t.ok)await put(k,{...o,ok:!o.ok,read:true});
  if(t.d&&confirm('حذف نهائي؟'))await rm(k,t.d);
  if(t.r||t.ok||t.d)inbox(k)}}
</script></body></html>
